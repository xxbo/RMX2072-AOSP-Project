name: RMX2072 6.18 Device Tree
on:
  workflow_dispatch:
    inputs:
      verify_super_tools:
        description: Fetch and verify the pinned aarch64 liblp and device-mapper runtime
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rmx2072-device-tree.yml'
      - 'device/realme/bladerunner_48m/dts/**'
      - 'device/realme/bladerunner_48m/bootstrap/diag-*.sh'
      - 'scripts/build/**'
      - 'scripts/device_audit/inspect_boot_dt.py'
      - 'scripts/device_audit/watchdog_smoke.sh'
      - 'scripts/device_audit/ufs_phy_cycle.sh'
      - 'scripts/device_audit/ufs_host_trial.sh'
      - 'scripts/device_audit/ufs_g3_test.sh'
      - 'scripts/device_audit/super_readonly.sh'
      - 'scripts/device_audit/check_super.py'
      - 'scripts/device_audit/check_verity.py'
      - 'scripts/device_audit/verity_readonly.sh'
      - 'scripts/device_audit/gsi17_mount.sh'
      - 'scripts/device_audit/gsi17_policy.sh'
      - 'scripts/device_audit/gsi_init_probe.c'
      - 'build/device/f20-odm-verity-reference.json'
      - 'scripts/device_audit/gsi_usb_reader.c'
      - 'scripts/device_audit/serve_gsi_usb.py'
      - 'build/device/gsi17-mount-reference.json'
      - 'build/device/f20-verity-reference.json'
      - 'build/super-readonly-apks.json'
      - 'sources/SOURCE_LOCK.json'
      - 'tests/**'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the device tree compiler from the Ubuntu archive
        run: |
          sources="$RUNNER_TEMP/rmx-ubuntu.list"
          for suite in noble noble-updates noble-security; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main"
          done > "$sources"
          options=(-o "Dir::Etc::sourcelist=$sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y gcc device-tree-compiler
      - name: Check diagnostic scripts and host regressions
        run: |
          python -m pip install cryptography
          sh -n scripts/device_audit/gsi17_mount.sh
          sh -n scripts/device_audit/gsi17_policy.sh
          for script in device/realme/bladerunner_48m/bootstrap/diag-*.sh scripts/device_audit/watchdog_smoke.sh scripts/device_audit/ufs_phy_cycle.sh scripts/device_audit/ufs_host_trial.sh scripts/device_audit/ufs_g3_test.sh scripts/device_audit/super_readonly.sh scripts/device_audit/verity_readonly.sh; do sh -n "$script"; done
          python -m unittest discover -s tests
      - name: Cross-compile the static Android 17 dm-user reader
        run: |
          ndk="${ANDROID_NDK_HOME:-}"
          if [ ! -d "$ndk/toolchains/llvm/prebuilt" ]; then
            ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          fi
          python scripts/build/build_gsi_usb_reader.py --ndk "$ndk" --output "$RUNNER_TEMP/gsi-usb-reader"
          python scripts/build/build_gsi_usb_reader.py --ndk "$ndk" --init-probe --output "$RUNNER_TEMP/gsi-init-probe"
      - name: Compile and apply board overlay
        run: python scripts/build/build_device_dt.py --work "$RUNNER_TEMP/rmx-dt" --output reports/device-tree
      - name: Verify the read-only super diagnostic runtime
        if: inputs.verify_super_tools
        run: python scripts/build/super_tools.py --cache "$RUNNER_TEMP/rmx-super-apks"
      - name: Prepare core-only handoff profile
        run: >-
          python scripts/build/prepare_core_only_dt.py
          --input reports/device-tree/sm8250-realme-rmx2072-usb-diag.dtb
          --output reports/device-tree/sm8250-realme-rmx2072-core-only.dtb
      - uses: actions/upload-artifact@v4
        with:
          name: rmx2072-618-device-tree-${{ github.run_number }}
          path: reports/device-tree/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rmx2072-618-dt-compile-log-${{ github.run_number }}
          path: reports/device-tree/compile.log
          if-no-files-found: ignore
          retention-days: 14
