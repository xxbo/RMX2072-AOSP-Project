name: GKI 6.18 Kernel and Strict NFC Build

on:
  workflow_dispatch:
    inputs:
      nfc_probe:
        description: Build NQ-NCI against the same complete Kleaf kernel
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gki-618-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gki:
    name: Build pinned Android 17 GKI and NQ-NCI DDK module
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git gnupg gperf kmod llvm \
            libdw-dev libelf-dev libncurses-dev libssl-dev \
            python3 rsync unzip zip zlib1g-dev
      - name: Build GKI from the complete dependency lock
        run: bash scripts/kernel_research/build_gki_618_kleaf.sh
      - name: Build NQ-NCI through strict Kleaf DDK
        if: ${{ inputs.nfc_probe }}
        run: bash scripts/kernel_research/build_nq_nci_ddk.sh
      - name: Upload complete GKI distribution and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx2072-gki-618-kernel-${{ github.run_number }}
          path: artifacts/gki-6.18-kernel-build/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload NFC module or failure evidence
        if: ${{ always() && inputs.nfc_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rmx2072-nfc-nq-ddk-${{ github.run_number }}
          path: artifacts/nfc-nq-ddk/
          if-no-files-found: warn
          retention-days: 14
