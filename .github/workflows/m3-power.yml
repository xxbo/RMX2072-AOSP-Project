name: M3 source Power HAL for framework startup
on:
  workflow_dispatch:
  push:
    branches: [bringup/m3-display]
    paths:
      - '.github/workflows/m3-power.yml'
      - 'scripts/build/build_m3_power.sh'
      - 'device/realme/bladerunner_48m/m3-power/**'
permissions:
  contents: read
concurrency:
  group: m3-power-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install source build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y repo git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
      - name: Prepare pinned native source workspace
        run: bash scripts/build/build_m3_power.sh prepare
      - name: Build Power service and native dependencies
        run: bash scripts/build/build_m3_power.sh build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-power-${{ github.run_number }}
          path: artifacts/m3-power/
          if-no-files-found: error
          retention-days: 7
