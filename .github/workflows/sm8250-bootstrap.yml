name: SM8250 6.18 Platform Bootstrap
on:
  workflow_dispatch:
    inputs:
      pon_power:
        description: Build the separately qualified RMX2072 PON/poweroff candidate
        type: boolean
        default: false
      source_pon:
        description: Use M2 upstream PON binding instead of the temporary legacy alias
        type: boolean
        default: false
      display:
        description: Build M3 DPU/DSI and the source RM19795 panel (requires source_pon)
        type: boolean
        default: false
      input_devices:
        description: Build the source GTX8 touch driver for the M3 input candidate
        type: boolean
        default: false
      battery_gauge:
        description: Build the pinned BQ27xxx I2C gauge driver without NVM updates
        type: boolean
        default: false
      performance:
        description: Build SM8250 EPSS CPUfreq, TSENS and Adreno performance prerequisites
        type: boolean
        default: false
      wifi:
        description: Build native QCA6390 PCIe, ath11k and power sequencing prerequisites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sm8250-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          # Kleaf brings its own pinned toolchains on this ephemeral runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache
          df -h /
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf libdw-dev libelf-dev libncurses-dev libssl-dev python3 rsync unzip zip zlib1g-dev
      - name: Build SM8250 early-boot platform drivers
        env:
          RMX2072_PON_POWER: ${{ inputs.pon_power && '1' || '0' }}
          RMX2072_SOURCE_PON: ${{ inputs.source_pon && '1' || '0' }}
          RMX2072_DISPLAY: ${{ inputs.display && '1' || '0' }}
          RMX2072_INPUT: ${{ inputs.input_devices && '1' || '0' }}
          RMX2072_BATTERY: ${{ inputs.battery_gauge && '1' || '0' }}
          RMX2072_PERFORMANCE: ${{ inputs.performance && '1' || '0' }}
          RMX2072_WIFI: ${{ inputs.wifi && '1' || '0' }}
        run: bash scripts/kernel_research/build_sm8250_bootstrap.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sm8250-618-bootstrap-${{ github.run_number }}
          path: artifacts/sm8250-bootstrap/
          if-no-files-found: warn
          retention-days: 14
