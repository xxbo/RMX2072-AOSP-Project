name: M3 Adreno Turnip Android driver
on:
  workflow_dispatch:
  push:
    branches: [bringup/m3-display]
    paths:
      - '.github/workflows/m3-turnip.yml'
      - 'scripts/build/build_m3_turnip.sh'
      - 'build/m3-turnip-source.json'
permissions:
  contents: read
concurrency:
  group: m3-turnip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex pkg-config python3-venv patchelf glslang-tools
          python3 -m venv "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/pip" install meson==1.9.1 ninja==1.13.0 mako==1.3.10 packaging pyyaml
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build pinned ARM64 Turnip for MSM DRM
        run: bash scripts/build/build_m3_turnip.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-turnip-${{ github.run_number }}
          path: artifacts/m3-turnip/
          retention-days: 7
          if-no-files-found: error
